name: ci

# Runs on every PR. Never on a self-hosted runner: a PR can come from a
# stranger's fork, and its code would run on your laptop (see Part C).
on:
  pull_request:

# Least privilege: the GITHUB_TOKEN can only READ the repo. Jobs that need
# more (pushing images, attestations) ask for it explicitly, in other workflows.
permissions:
  contents: read

# A new push to the same PR cancels the still-running old run: faster
# feedback, fewer wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint                    # this exact name becomes the required check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA, not a tag: a tag can be moved to
      # malicious code (trivy-action, March 2026); a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true      # cache downloaded wheels between runs
      # --frozen: install exactly what uv.lock says; fail if it's out of date.
      - run: uv sync --frozen
      # --output-format=github turns findings into inline PR annotations.
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Unit tests only: SQLite, S3 mocked — fast, no services needed.
      - run: uv run pytest tests/unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Service containers: started before the steps, reachable on localhost,
    # thrown away after the job. Every run gets a clean DB and a clean S3.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Steps start only after pg_isready reports healthy.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
      floci:
        image: floci/floci:2.5.0   # same pinned version as your laptop
        ports: ["4566:4566"]
    env:
      APP_ENV: ci
      SECRET_KEY: ci-only-not-secret     # APP_ENV != dev, so this is required
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Floci has no health check here, so poll until S3 answers (max ~60 s).
      - name: Wait for Floci
        run: |
          for i in $(seq 30); do
            aws s3 ls >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Floci did not become ready" >&2
          exit 1
      # Fails on migrations that are unsafe while old pods still run (Module 10).
      - run: uv run python manage.py lintmigrations
      - run: uv run pytest tests/integration
